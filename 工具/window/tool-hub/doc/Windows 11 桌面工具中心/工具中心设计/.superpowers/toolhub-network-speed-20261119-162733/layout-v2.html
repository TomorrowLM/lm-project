<h2>网速放在 ToolHub 里面</h2>
<p class="subtitle">刷新间隔按 1 秒考虑；两种位置都不增加悬浮条宽度。选择更符合你说的“放在里面”。</p>

<div class="options">
  <div class="option" data-choice="search-pill" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>搜索胶囊内</h3>
      <p>圆形图标旁的现有搜索胶囊右侧显示两行速率；不增加整体宽度，但会占用一部分搜索文字空间。</p>
      <div class="mockup">
        <div class="mockup-header">只预览底部悬浮条</div>
        <div class="mockup-body">
          <div style="display:flex;align-items:center;gap:10px;min-height:86px;padding:6px;">
            <div style="display:flex;flex:1;min-width:0;align-items:center;justify-content:space-between;gap:8px;height:72px;padding:0 14px 0 22px;border-radius:36px;background:#fff;color:#748198;box-sizing:border-box;">
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 13px 'Microsoft YaHei UI',sans-serif;">向工具中心提问</span>
              <span style="display:flex;flex:none;flex-direction:column;gap:3px;font:500 11px 'Microsoft YaHei UI',sans-serif;line-height:1.2;white-space:nowrap;"><span style="color:#21865b;">↑ 680 KB/s</span><span style="color:#315fc7;">↓ 4.2 MB/s</span></span>
            </div>
            <div style="display:grid;flex:none;width:78px;height:78px;place-items:center;border-radius:50%;background:#fff;box-shadow:0 4px 14px #17233b22;"><div style="display:grid;width:62px;height:62px;place-items:center;border-radius:50%;background:#2b6cff;color:#fff;font:italic 500 40px Arial,sans-serif;">C</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="option" data-choice="diagnostics-row" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>诊断工具行内</h3>
      <p>在“系统稳定性诊断”这一行右侧显示；保留搜索框完整宽度，不增加菜单高度，但展开菜单时才能看到。</p>
      <div class="mockup">
        <div class="mockup-header">嵌入现有菜单行</div>
        <div class="mockup-body">
          <div style="display:flex;align-items:center;gap:16px;height:62px;padding:0 16px;border-radius:15px;background:#edf3ff;color:#18233a;box-sizing:border-box;font:400 15px 'Microsoft YaHei UI',sans-serif;">
            <span style="width:24px;text-align:center;font-size:20px;">⌁</span>
            <span style="flex:1;white-space:nowrap;">系统稳定性诊断</span>
            <span style="display:flex;flex-direction:column;gap:3px;font:500 11px 'Microsoft YaHei UI',sans-serif;line-height:1.2;white-space:nowrap;"><span style="color:#21865b;">↑ 680 KB/s</span><span style="color:#315fc7;">↓ 4.2 MB/s</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
