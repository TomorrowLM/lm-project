<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作区刷新与应用菜单</title>
<style>
  :root { font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; color: #102a4c; background: #dfeafa; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: 32px; background: linear-gradient(135deg, #eaf3ff, #d5e6ff); }
  .shell { width: min(960px, 100%); margin: auto; padding: 18px; border-radius: 28px; background: rgba(248,251,255,.86); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 20px 60px rgba(44,80,135,.18); backdrop-filter: blur(22px); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .title { display: flex; align-items: center; gap: 12px; }
  .title h1 { margin: 0; font-size: 25px; letter-spacing: .02em; }
  .title p { margin: 3px 0 0; color: #6680a4; font-size: 13px; }
  button { font: inherit; border: 0; cursor: pointer; }
  .refresh { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 14px; color: #174cbb; background: #eaf2ff; border: 1px solid #8bb1ff; font-size: 15px; }
  .refresh:hover { background: #dbe9ff; }
  .sync { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.68); color: #6b82a2; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #32a36c; box-shadow: 0 0 0 4px rgba(50,163,108,.14); }
  .workspace { padding: 18px; border-radius: 22px; background: rgba(255,255,255,.88); border: 1px solid #c8d8ec; margin-bottom: 14px; }
  .workspace.active { background: #edf4ff; border-color: #7ba4ff; box-shadow: 0 8px 22px rgba(52,103,220,.12); }
  .workspace-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .workspace-head h2 { margin: 0; font-size: 21px; }
  .workspace-head span { color: #6882a8; font-size: 13px; }
  .apps { display: flex; flex-wrap: wrap; gap: 10px; }
  .app { position: relative; display: inline-flex; align-items: center; gap: 9px; padding: 10px 15px; border-radius: 14px; background: #f8fbff; border: 1px solid #cddbed; color: #173b68; font-size: 16px; }
  .app.selected { background: #dceaff; border-color: #5d8cff; color: #175ad4; }
  .app::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3d73e6; }
  .app.monitor-2::before { background: #3aaa76; }
  .menu { position: absolute; z-index: 4; top: 48px; left: 50px; width: 230px; padding: 8px; border-radius: 18px; background: rgba(248,252,255,.96); border: 1px solid #d0ddec; box-shadow: 0 16px 32px rgba(30,57,95,.22); }
  .menu button { display: flex; width: 100%; align-items: center; gap: 11px; padding: 12px 13px; border-radius: 11px; background: transparent; text-align: left; color: #163962; font-size: 15px; }
  .menu button:hover { background: #e8f0ff; color: #155dd4; }
  .menu .danger { color: #c54747; }
  .menu .danger:hover { background: #fff0f0; color: #b52f2f; }
  .menu-label { padding: 7px 13px 5px; color: #7890ad; font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 4px 4px 0; color: #7188a8; font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 7px; height: 7px; border-radius: 50%; background: #3d73e6; }
  .legend i.green { background: #3aaa76; }
</style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="title"><div><h1>工作区</h1><p>应用状态与窗口位置</p></div></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="sync"><i class="dot"></i>刚刚同步</div>
        <button class="refresh" onclick="this.textContent='↻ 刷新中…'; setTimeout(()=>this.textContent='↻ 刷新工作区',900)">↻ 刷新工作区</button>
      </div>
    </div>
    <section class="workspace active">
      <div class="workspace-head"><h2>01&nbsp; 当前工作区</h2><span>显示器 1 · 3 个应用</span></div>
      <div class="apps">
        <button class="app selected">ChatGPT</button>
        <button class="app monitor-2">Google Chrome — 管理后台</button>
        <button class="app">微信</button>
        <div class="menu">
          <div class="menu-label">应用操作</div>
          <button>↗&nbsp; 打开 / 置前</button>
          <button>⇢&nbsp; 移动到工作区</button>
          <button>▣&nbsp; 移动到显示器</button>
          <button class="danger">×&nbsp; 关闭应用</button>
        </div>
      </div>
      <div class="legend"><span><i></i>显示器 1</span><span><i class="green"></i>显示器 2</span></div>
    </section>
    <section class="workspace">
      <div class="workspace-head"><h2>02&nbsp; 工作区 2</h2><span>2 个应用 · 其中 1 个已最小化</span></div>
      <div class="apps"><button class="app">Windows Terminal — 项目</button><button class="app monitor-2">VS Code — Microsoft</button></div>
    </section>
    <section class="workspace">
      <div class="workspace-head"><h2>03&nbsp; 工作区 3</h2><span>暂无应用</span></div>
      <div style="color:#7a91ae;font-size:15px">将窗口拖到此处</div>
    </section>
  </main>
</body>
</html>
